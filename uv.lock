    { name = "darkdetect", specifier = ">=0.8.0" },
    { name = "faster-whisper", specifier = ">=1.1.0" },
    { name = "numpy" },
    { name = "nvidia-cublas-cu12", marker = "extra == 'gpu'" },
    { name = "nvidia-cudnn-cu12", marker = "extra == 'gpu'", specifier = ">=9" },
    { name = "pillow", specifier = ">=10" },
    { name = "pynput", specifier = ">=1.7" },
    { name = "pystray", specifier = ">=0.19" },
    { name = "pywin32", specifier = ">=306" },
    { name = "sounddevice", specifier = ">=0.5" },
    { name = "sv-ttk", specifier = ">=2.6.1" },
]
provides-extras = ["gpu"]

[package.metadata.requires-dev]
dev = [{ name = "pyinstaller", specifier = ">=6.10" }]
