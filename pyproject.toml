[project]
name = "viska"
version = "0.2.0"
description = "Lokal diktering för Windows – tala var som helst, texten skrivs där markören är. Ingen data lämnar datorn."
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1.0",
    "sounddevice>=0.5",
    "numpy",
    "pynput>=1.7",
    "pystray>=0.19",
    "Pillow>=10",
    "pywin32>=306",
    "sv-ttk>=2.6.1",
    "darkdetect>=0.8.0",
]

[project.optional-dependencies]
gpu = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9",
]

[project.scripts]
viska = "viska.app:main"

[dependency-groups]
dev = ["pyinstaller>=6.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["viska"]
